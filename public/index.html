<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMEGA MARKET — Produtos digitais com entrega imediata</title>
  <meta name="description" content="Templates, e-books, cursos, softwares e licenças com entrega imediata. Pagamento seguro via Mercado Pago.">
  <meta name="theme-color" content="#07080d">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script type="module" src="/assets/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>
  <div id="announcement" class="announcement" hidden></div>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/" aria-label="Página inicial">
        <span class="brand-mark" aria-hidden="true">Ω</span>
        <span class="brand-name" id="brand-name">OMEGA MARKET</span>
      </a>
      <form class="search" id="search-form" role="search">
        <input id="search-input" type="search" name="q" placeholder="Buscar templates, cursos, e-books…" autocomplete="off" aria-label="Buscar produtos">
      </form>
      <nav class="nav" id="nav" aria-label="Principal"></nav>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="footer">
    <div class="wrap footer-inner">
      <div>
        <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">Ω</span><span class="brand-name">OMEGA MARKET</span></a>
        <p class="muted" id="footer-tagline">O universo digital ao seu alcance.</p>
      </div>
      <div class="footer-links">
        <a href="#/produtos">Todos os produtos</a>
        <a href="#/biblioteca">Minha biblioteca</a>
        <a href="#/pedidos">Meus pedidos</a>
      </div>
      <div class="footer-pay">
        <span class="pill">Pix</span><span class="pill">Cartão</span><span class="pill">Boleto</span>
        <p class="muted small">Pagamentos processados pelo Mercado Pago. Não armazenamos dados de cartão.</p>
      </div>
    </div>
  </footer>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
